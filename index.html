<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一页书｜个人知识库</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .hero {
            background: white;
            border-radius: 20px;
            padding: 55px 50px;
            margin-bottom: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .hero h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 2px;
        }

        .hero p {
            margin-top: 14px;
            font-size: 18px;
            color: #6b7280;
        }

        .line {
            width: 55px;
            height: 4px;
            background: #0075c1;
            margin-top: 25px;
            border-radius: 5px;
        }

        .section-title {
            font-size: 24px;
            margin: 35px 0 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 28px 22px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.09);
        }

        .card .icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin: 0 0 8px;
            font-size: 19px;
        }

        .card p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .about {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-top: 28px;
            line-height: 1.8;
            color: #4b5563;
        }

        footer {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-top: 45px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero {
                padding: 40px 28px;
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <section class="hero">
        <h1>一页书</h1>
        <p>我的个人知识库</p>
        <div class="line"></div>
    </section>

    <h2 class="section-title">知识分类</h2>

    <div class="grid">

        <a class="card" href="#">
            <div class="icon">🌎</div>
            <h3>英语</h3>
            <p>English · 词汇 · 语法 · 发音 · 听力</p>
        </a>

        <a class="card" href="#">
            <div class="icon">⚖️</div>
            <h3>法律</h3>
            <p>法律知识 · 法条 · 司法解释 · 案例</p>
        </a>

        <a class="card" href="#">
            <div class="icon">📋</div>
            <h3>保险</h3>
            <p>保险实务 · 理赔 · 查勘 · 医学核赔</p>
        </a>

        <a class="card" href="#">
            <div class="icon">🩺</div>
            <h3>医学</h3>
            <p>疾病 · 诊断 · 病理 · 分期 · 指南</p>
        </a>

    </div>

    <h2 class="section-title">关于一页书</h2>

    <div class="about">
        这里记录我的学习、思考和知识积累。
        <br>
        希望把零散的信息整理成结构化、可长期使用的个人知识库。
    </div>

    <footer>
        一页书 · 个人知识库
    </footer>

</div>

</body>
</html>
