            box-sizing: border-box;

        body {

        .back {
            color: #0075c1;
            text-decoration: none;
            font-size: 15px;
        }

        .hero {
            background: white;
            border-radius: 18px;
            padding: 35px;
            margin: 25px 0;
            box-shadow: 0 6px 25px rgba(0,0,0,0.05);

        .hero h1 {

        }

        .word {
            background: white;
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 18px;

        }

        .word h2 {
            margin: 0 0 8px;

    <a class="back" href="english.html">← 返回英语</a>

    <section class="hero">
        <h1>词汇 Vocabulary</h1>
        <p>记录单词、多义词、短语、固定搭配和地道表达。</p>
    </section>

    <div class="word">
        <h2>stake</h2>
        <div class="ipa">/steɪk/</div>
        <div class="meaning">n. 利益；股份；赌注；风险</div>

        <div class="example">
            <strong>例句：</strong><br>
            He has a stake in the company.
            <br>
            他在这家公司拥有股份。
        </div>

        <div class="note">
            根据不同语境，stake 可以表示“股份、利益、赌注”等。
        </div>
    </div>

    <div class="word">
        <h2>numerous</h2>
        <div class="ipa">/ˈnuːmərəs/</div>
        <div class="meaning">adj. 众多的；许多的</div>

        <div class="example">
            <strong>例句：</strong><br>
            There are numerous reasons for this decision.
            <br>
            做出这个决定有很多原因。
        </div>
    </div>

</div>
