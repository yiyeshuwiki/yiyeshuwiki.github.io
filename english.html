<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语｜一页书</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 24px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #0075c1;
            text-decoration: none;
            font-size: 15px;
        }

        .hero {
            background: white;
            border-radius: 20px;
            padding: 45px 45px;
            margin-bottom: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .hero h1 {
            margin: 0;
            font-size: 40px;
        }

        .hero p {
            margin: 12px 0 0;
            color: #6b7280;
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px 25px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 5px 20px rgba(0,0,0,0.04);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.09);
        }

        .number {
            font-size: 14px;
            color: #0075c1;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        .card p {
            margin: 0;
            color: #6b7280;
            line-height: 1.7;
            font-size: 14px;
        }

        footer {
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-top: 50px;
        }

        @media (max-width: 750px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back" href="index.html">← 返回一页书</a>

    <section class="hero">
        <h1>英语 English</h1>
        <p>记录英语学习中的词汇、语法、听力、阅读与口语知识。</p>
    </section>

    <div class="grid">

        <a class="card" href="#">
            <div class="number">01</div>
            <h2>词汇</h2>
            <p>单词 · 短语 · 多义词 · 固定搭配 · 词源</p>
        </a>

        <a class="card" href="#">
            <div class="number">02</div>
            <h2>语法</h2>
            <p>时态 · 句型 · 从句 · 介词 · 常见语法问题</p>
        </a>

        <a class="card" href="#">
            <div class="number">03</div>
            <h2>听力</h2>
            <p>发音 · 连读 · 弱读 · 重音 · 听辨 · 影视听力</p>
        </a>

        <a class="card" href="#">
            <div class="number">04</div>
            <h2>阅读</h2>
            <p>阅读理解 · 新闻 · 文章 · 阅读技巧</p>
        </a>

        <a class="card" href="#">
            <div class="number">05</div>
            <h2>口语</h2>
            <p>日常表达 · 口语句型 · 地道表达 · 情景对话</p>
        </a>

        <a class="card" href="#">
            <div class="number">06</div>
            <h2>其他</h2>
            <p>学习方法 · 学习记录 · 其他英语相关内容</p>
        </a>

    </div>

    <footer>
        一页书 · 英语知识库
    </footer>

</div>

</body>
</html>
